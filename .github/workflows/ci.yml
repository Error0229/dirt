name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The voice engine's libraries, Silero's detector and the speech model
  # are fetched when `dirt-voice` builds, each checked against a pinned
  # SHA-256, into this folder (crates/dirt-voice/build/fetch.rs). Each job
  # that builds it keeps the folder in its cache, keyed on the pins.
  DIRT_BUILD_CACHE: ${{ github.workspace }}/.dirt-build-cache
  # The speech model (130 MiB) is left out of every job but `voice`: none
  # of the others ships the app or reads speech. The detector and the
  # engine's libraries, a few MiB, are still fetched and linked.
  DIRT_VOICE_MODEL: skip
  # Voice must build: a job that cannot fetch the engine fails rather than
  # building the app without its mic.
  DIRT_VOICE: required

jobs:
  security-guard:
    name: Security Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        uses: ./.github/actions/apt-install
        with:
          packages: ripgrep

      - name: Run security guardrails
        run: bash .github/scripts/security-guard.sh

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libappindicator3-dev libdbus-1-dev libasound2-dev

      # rustup reads the version and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache what dirt-voice fetches
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --workspace is required: the root manifest is also a package, so
      # without it cargo checks only that package and its dependencies.
      - name: Check
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libappindicator3-dev libdbus-1-dev libasound2-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache what dirt-voice fetches
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The server's integration tests and the sync simulation need Postgres,
      # which only the Linux job below provides. The server's unit tests need
      # nothing and run everywhere.
      - name: Run tests
        if: runner.os != 'Windows'
        run: |
          cargo test --workspace --exclude dirt-api --exclude dirt-sim --verbose
          cargo test -p dirt-api --lib --verbose

      - name: Run tests (Windows serialized)
        if: runner.os == 'Windows'
        run: |
          $env:RUST_TEST_THREADS = "1"
          cargo test --workspace --exclude dirt-api --exclude dirt-sim --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p dirt-api --lib --verbose

  server-test:
    name: Server and sync simulation tests (Postgres)
    runs-on: ubuntu-latest
    services:
      # Version 18 matches the Neon project.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: dirt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Object storage for files, speaking the S3 protocol as Cloudflare R2
      # does in production. The same image and settings as compose.yaml;
      # the tests look for it at 127.0.0.1:59000.
      files:
        image: versity/versitygw@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
        env:
          ROOT_ACCESS_KEY: dirt
          ROOT_SECRET_KEY: dirt-local-files
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp
        ports:
          - 59000:7070
    env:
      # Each test creates its own throwaway database on this server.
      DATABASE_URL: postgres://postgres:dirt@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Run the server's tests
        run: cargo test -p dirt-api --verbose

      # Real client cores syncing through the real server, in one process.
      - name: Run the sync simulation
        run: cargo test -p dirt-sim --verbose

      # The scripts that dump the database and restore it, against the same
      # server. The client programs must be as new as the server.
      - name: Install age and the Postgres repository's script
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-common age

      - name: Install the Postgres 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump the database and restore it
        run: scripts/check-backup.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libappindicator3-dev libdbus-1-dev libasound2-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache what dirt-voice fetches
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libappindicator3-dev libdbus-1-dev libasound2-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache what dirt-voice fetches
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --all --release

  # The one job that fetches the speech model, and reads speech with it:
  # the model reading the two recordings in its archive, through the
  # recording's format and the cutter (crates/dirt-voice/tests).
  voice:
    name: Voice (the speech model)
    runs-on: ubuntu-latest
    env:
      DIRT_VOICE_MODEL: fetch
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache what dirt-voice fetches, the model included
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-model-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-voice-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-voice-

      - name: Read speech with the model
        run: cargo test -p dirt-voice -- --include-ignored

  android-mobile-check:
    name: Android Mobile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only sdkmanager on PATH is needed here, not the action's default
      # packages; the NDK is installed in the next step.
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install Rust toolchain and Android target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # The engine's Android libraries (43 MiB) and Silero's detector, fetched
      # by their pins: kept across runs, as the other jobs keep theirs.
      - name: Cache what dirt-voice fetches
        uses: actions/cache@v6
        with:
          path: .dirt-build-cache
          key: ${{ runner.os }}-dirt-voice-android-${{ hashFiles('crates/dirt-voice/build.rs', 'crates/dirt-voice/sherpa-onnx-sys/build.rs') }}

      # A build, not a check: only linking shows whether the bundled SQLite
      # and the rest of the native code fit together for Android.
      - name: Build dirt-mobile for the Android target
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          export TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_API=24
          test -x "$TOOLCHAIN/x86_64-linux-android${ANDROID_API}-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android${ANDROID_API}-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/x86_64-linux-android${ANDROID_API}-clang"
          export CXX_x86_64_linux_android="$TOOLCHAIN/x86_64-linux-android${ANDROID_API}-clang++"
          export AR_x86_64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build -p dirt-mobile --target x86_64-linux-android
          # The code that is Android's alone (the voice, the jobs' way in)
          # is linted nowhere else. With the gallery too: it replaces the
          # app when its feature is on, and no other job compiles it.
          cargo clippy -p dirt-mobile --target x86_64-linux-android --all-targets -- -D warnings
          cargo clippy -p dirt-mobile --target x86_64-linux-android --all-targets --features gallery -- -D warnings
