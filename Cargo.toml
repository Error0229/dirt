[workspace]
resolver = "2"
members = ["crates/*"]

# Root-level package whose only job is to be the Vercel deploy surface.
# Vercel's Rust runtime picks up `api/axum.rs` and builds it as a serverless
# function; routing it there via `vercel.json` rewrites gives us a single
# axum Router at the edge. dirt-api stays the library where the interesting
# code actually lives.
[package]
name = "dirt-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vercel serverless entry point for dirt-api"
publish = false

[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
dirt-api = { path = "crates/dirt-api" }
tokio.workspace = true
tower = "0.5"
# The `axum` feature pulls in VercelLayer so the Router built in
# dirt_api::build_router can be dropped straight into vercel_runtime::run.
vercel_runtime = { version = "2", features = ["axum"] }

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Error0229/dirt"
authors = ["Cato"]
description = "Do I Remember That? - A cross-platform app for capturing fleeting thoughts"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"

# The clients' local database.
#
# Held at 0.39 by the server's database driver. sqlx 0.9 lists an optional
# SQLite driver that needs libsqlite3-sys below 0.38, and Cargo allows one
# version of that crate in a workspace whether or not the driver is turned
# on. rusqlite 0.39 is the newest release that uses libsqlite3-sys 0.37.
# Raise this together with sqlx.
rusqlite = { version = "0.39", features = ["bundled"] }

# Note documents. yrs is pinned exactly: its encoding is what gets stored and,
# from step 5, uploaded, so a version change is a format decision.
yrs = "=0.28.1"
similar = "2"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt", "sync", "time"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Testing
pretty_assertions = "1.4"
wiremock = "0.6"

# Dioxus
dioxus = { version = "0.7" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow these pedantic lints (too noisy for new project)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
# Asks for `assert_eq!(notes, [] as [Note; 0])` in place of
# `assert!(notes.is_empty())`, which is harder to read in tests.
assert_is_empty = "allow"

# Restriction lints (opt-in)
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
