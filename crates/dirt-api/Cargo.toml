[package]
name = "dirt-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Dirt server: device registry and encrypted note storage on Postgres"

[lib]
name = "dirt_api"
path = "src/lib.rs"

[[bin]]
name = "dirt-api"
path = "src/main.rs"

[dependencies]
# The server shares only wire-level types with the clients.
dirt-proto = { path = "../dirt-proto" }

axum = { version = "0.8", features = ["macros", "json"] }
base64 = "0.22"
dotenvy = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.9"
# Fetches Clerk's published signing keys. Nothing else in the server makes
# outgoing requests.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# The function API (`sqlx::query_as`) is used throughout, never the
# compile-time `query!` macros, so building needs no database. The `macros`
# feature is on only for `sqlx::migrate!` and `#[sqlx::test]`.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "migrate",
    "macros",
    "uuid",
] }
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rusty-s3 = "0.11.0"

[dev-dependencies]
http-body-util = "0.1"
# Tests sign ID tokens with a key made on the spot, standing in for Clerk.
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
