[package]
name = "dirt-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dirt sync backend — bearer-authed push/pull over Turso"

[lib]
name = "dirt_api"
path = "src/lib.rs"

# Local dev server: `cargo run -p dirt-api`.
[[bin]]
name = "dirt-api"
path = "src/main.rs"

# Vercel serverless entry point. Deployed by pointing Vercel's Root Directory
# at `crates/dirt-api/` so it picks up `api/axum.rs` as a Rust serverless
# function. Locally this binary is inert — nothing calls it outside Vercel.
[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
dirt-core = { path = "../dirt-core" }

axum = { version = "0.8", features = ["macros", "json"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
libsql.workspace = true

# Constant-time byte compare for the shared bearer token — prevents timing
# side-channels that would leak the token one character at a time through
# normal == comparisons.
subtle = "2"

tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
dotenvy = "0.15"
base64 = "0.22"

# Vercel Rust runtime adapter. Only used by `api/axum.rs`; the local dev
# binary doesn't touch it. The `axum` feature pulls in VercelLayer so the
# Router we already build can be dropped straight into vercel_runtime::run.
vercel_runtime = { version = "2", features = ["axum"] }

[lints]
workspace = true
