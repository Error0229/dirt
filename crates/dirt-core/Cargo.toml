[package]
name = "dirt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Dirt - models, database, and business logic"

[features]
# On by default, for the desktop app and the CLI. `dirt-sim` and
# `dirt-mobile` turn it off: the simulation keeps secrets in memory and
# must build on a Linux image without libdbus, and Android has its own
# secure storage.
default = ["keyring-store"]

# Enables `secrets::KeyringSecrets` and the `keyring` crate under it. On
# Linux that needs `libdbus-1-dev`.
keyring-store = ["dep:keyring"]

[dependencies]
dirt-proto = { path = "../dirt-proto" }
yrs.workspace = true
similar.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
rusqlite.workspace = true
# `net` and `io-util` are for the listener the browser returns to at sign-in.
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Clears keys from memory when they are dropped, as far as that can be done.
zeroize = { version = "1.8", features = ["derive"] }
# Note encryption and device keys. Audited implementations; nothing in this
# crate implements a cipher itself.
# `stream` is the STREAM construction that chains a file's pieces.
chacha20poly1305 = { version = "0.10", features = ["stream"] }
base64 = "0.22"
# The PKCE challenge of the sign-in is a SHA-256 hash.
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# The key agreement and short code of the device approval exchange. This is
# Matrix's implementation of its own short-code verification; only its `sas`
# module is used.
vodozemac = { version = "0.11", default-features = false }
# The recovery phrase: the standard word list and its checksum.
bip39 = { version = "2", default-features = false, features = ["std"] }
# Derives the two keys a recovery phrase stands for.
hkdf = "0.12"
# Reads a picture to make its thumbnail. Only the formats a phone or a
# screenshot produces; nothing here writes any but JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# The operating system's keychain, for `secrets::KeyringSecrets`: Keychain
# on macOS, Credential Manager on Windows, the Secret Service over DBus on
# Linux. Not for Android, which the `keyring` crate does not support and
# where `dirt-mobile` uses the platform's encrypted preferences. Optional,
# so that the `keyring-store` feature can leave it out altogether.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

[dev-dependencies]
# The deletion tests compare against plain yrs behaviour.
yrs.workspace = true
tempfile = "3"
# A stand-in identity provider for the sign-in tests.
wiremock = { workspace = true }

[lints]
workspace = true
