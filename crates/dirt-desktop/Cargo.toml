[package]
name = "dirt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application for Dirt"

[[bin]]
name = "dirt-desktop"
path = "src/main.rs"

[dependencies]
dirt-core = { path = "../dirt-core" }
dioxus = { workspace = true, features = ["desktop"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs = "6"
# `rt`: attaching files runs as a task of its own, which outlives the part
# of the window that started it.
tokio = { version = "1", features = ["time", "rt"] }
uuid.workspace = true
# Hands a file to the system to open with whatever shows files of its kind.
open = "5"
global-hotkey = "0.6"
tray-icon = "0.19"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-query = "0.9.2"
rfd = "0.15"
thiserror.workspace = true
single-instance = "0.3"
# Opens the system browser on the sign-in page.
webbrowser = "1"

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
