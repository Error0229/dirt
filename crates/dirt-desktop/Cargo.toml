[package]
name = "dirt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application for Dirt"

[[bin]]
name = "dirt-desktop"
path = "src/main.rs"

[features]
# Shows the interface's gallery (`dirt_ui::gallery`) in place of the app.
# For development only: see CLAUDE.md, Development Commands.
gallery = ["dirt-ui/gallery"]

[dependencies]
dirt-core = { path = "../dirt-core" }
dirt-ui = { path = "../dirt-ui" }
dioxus = { workspace = true, features = ["desktop"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs = "6"
# `rt`: attaching files runs as a task of its own, which outlives the part
# of the window that started it; `sync`: the page's work for the store
# waits its turn on a channel (`screen::writing`).
tokio = { version = "1", features = ["time", "rt", "sync"] }
uuid.workspace = true
# Hands a file to the system to open with whatever shows files of its kind.
open = "5"
global-hotkey = "0.6"
tray-icon = "0.19"
rfd = "0.15"
# Copy and Paste for the app's own menu, and copying a note's text: a
# web view may not read the clipboard without asking.
arboard = { version = "3", default-features = false }
thiserror.workspace = true
single-instance = "0.3"
# Opens the system browser on the sign-in page.
webbrowser = "1"

# Quick capture gives the keyboard back to the window that had it, as it is
# put away (the version already in the build).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
