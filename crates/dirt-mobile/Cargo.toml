[package]
name = "dirt-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Android shell application for Dirt"

[[bin]]
name = "dirt-mobile"
path = "src/main.rs"

[dependencies]
# Without dirt-core's `keyring-store`: the app is Android-only, and on
# Android the account's keys are kept in the platform's encrypted
# preferences (`services::secure_storage`), not in a desktop keychain.
dirt-core = { path = "../dirt-core", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
dirs = "6"
thiserror.workspace = true
# The IDs of a note's files.
uuid.workspace = true
# Attaching files runs as a task of its own.
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { workspace = true, features = ["mobile"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
# JNI bridge for the device's secure storage. `ndk-context` exposes the
# JavaVM and Activity handles the Dioxus mobile runtime publishes; `jni`
# is the Rust binding to Android's Java APIs (KeyStore and AndroidX
# EncryptedSharedPreferences).
jni = "0.21"
ndk-context = "0.1"
# Opens the system browser on the sign-in page.
webbrowser = "1"

[build-dependencies]
dotenvy = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The host tests are async and open the note store on a file inside a
# temporary folder.
tokio.workspace = true
tempfile = "3"

[lints]
workspace = true
