[package]
name = "dirt-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Android shell application for Dirt"

[[bin]]
name = "dirt-mobile"
path = "src/main.rs"

[features]
# Shows the interface's gallery (`dirt_ui::gallery`) in place of the app.
# For development only: see CLAUDE.md, Development Commands.
gallery = ["dirt-ui/gallery"]

[dependencies]
# Without dirt-core's `keyring-store`: the app is Android-only, and on
# Android the account's keys are kept in the platform's encrypted
# preferences (`services::secure_storage`), not in a desktop keychain.
dirt-core = { path = "../dirt-core", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
dirs = "6"
thiserror.workspace = true
# The IDs of a note's files.
uuid.workspace = true
# Attaching files runs as a task of its own.
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { workspace = true, features = ["mobile"] }
dirt-ui = { path = "../dirt-ui" }
# JNI bridge for the device's secure storage. `ndk-context` exposes the
# JavaVM and Activity handles the Dioxus mobile runtime publishes; `jni`
# is the Rust binding to Android's Java APIs (KeyStore and AndroidX
# EncryptedSharedPreferences).
jni = "0.21"
ndk-context = "0.1"
# Opens the system browser on the sign-in page.
webbrowser = "1"
# Declares the Gradle module of native code (`android/native`) to `dx`,
# with `#[manganis::ffi]` in main.rs. The version Dioxus brings.
manganis = "0.7"
# Speech turned into text on the phone (interface design 6.18, 8.9). Its
# build puts the voice folder together, which `build.rs` puts in the APK.
# The microphone is Android's `AudioRecord`, in Kotlin, which hands its
# sound over (`voice`): no cpal.
dirt-voice = { path = "../dirt-voice" }

[build-dependencies]
dotenvy = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The native parts' colours are made from its tokens
# (`tests/android_colours.rs`).
dirt-ui = { path = "../dirt-ui" }
# The host tests are async and open the note store on a file inside a
# temporary folder.
tokio.workspace = true
tempfile = "3"

[lints]
workspace = true
