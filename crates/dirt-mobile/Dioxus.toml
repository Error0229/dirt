[application]
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

# Pull AndroidX Security into the generated APK so that the JNI-backed
# secure storage (`services::secure_storage`) can call `MasterKey.Builder`
# and `EncryptedSharedPreferences.create`. The account's keys are kept
# there. Version is the most recent stable pre-1.1; the API has been frozen
# since 1.0 so any 1.1.x build is compatible with the JNI bridge.
[android]
gradle_dependencies = [
    "androidx.security:security-crypto:1.1.0-alpha06",
]
