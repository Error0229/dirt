[package]
name = "dirt-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What Dirt's desktop and Android apps share of the interface: tokens, fonts, icons, motion and components"

[features]
# The gallery: every component on one screen, for looking at them while
# they are built. Each app has a `gallery` feature that turns this on and
# shows the gallery in place of the app.
gallery = []

[dependencies]
# A picture pasted into the page comes from the script as text in Base64.
base64 = "0.22"
# The answer to the web view's request for a file the preview shows, as
# both apps' asset handlers hand it on (the version wry's is).
http = "1"
# For the settings the interface applies (theme, accent). Without
# `keyring-store`, which the Android app must not build.
dirt-core = { path = "../dirt-core", default-features = false }
dioxus.workspace = true
# Local dates for the times a list shows (`time`).
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Settings waits a moment between looks for a new device, and while the
# drawn tick shows. Its session's own work runs on the same runtime, and
# the pile's heap is worked out on its threads for blocking work.
tokio = { workspace = true, features = ["time", "rt", "sync"] }
# The IDs of devices, in Settings.
uuid.workspace = true

[lints]
workspace = true
