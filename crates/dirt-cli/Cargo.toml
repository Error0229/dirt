[package]
name = "dirt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Dirt"

[[bin]]
name = "dirt"
path = "src/main.rs"

[dependencies]
# The keychain is where the CLI and the desktop app keep the account's keys,
# so the feature is named here and not left to dirt-core's defaults.
dirt-core = { path = "../dirt-core", features = ["keyring-store"] }
# Opens the system browser on the sign-in page.
webbrowser = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
tracing-subscriber.workspace = true
dirs = "6"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
