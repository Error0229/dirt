[package]
name = "dirt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Dirt"

[[bin]]
name = "dirt"
path = "src/main.rs"

[dependencies]
# Explicit `features = ["keyring-store"]` instead of relying on
# dirt-core's defaults: `dirt auth login`/`logout` cannot work without
# the keyring backend, so disabling it from the consumer side (via
# `default-features = false`) would silently break the auth subsystem
# at runtime. Stating the requirement at the dep declaration makes
# that contract visible at the Cargo level.
dirt-core = { path = "../dirt-core", features = ["keyring-store"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "6"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
libsql.workspace = true

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
